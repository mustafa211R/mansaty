<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>دروس اليوتيوب | منصة طالب</title>
  <meta name="description" content="مكتبة الفيديوهات التعليمية لمنصة طالب — دروس مصوّرة وفق المناهج الدراسية العراقية.">
  <meta name="keywords" content="فيديوهات تعليمية, دروس يوتيوب, منصة طالب, مناهج عراقية">
  <meta name="author" content="الأستاذ مصطفى رحيم فندي">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="دروس اليوتيوب | منصة طالب">
  <meta property="og:description" content="مكتبة الفيديوهات التعليمية لمنصة طالب.">
  <meta property="og:image" content="../../logo.jfif">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">

  <link rel="icon" type="image/png" href="../../logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="../../package/dist/tailwind.css" rel="stylesheet">
  <link href="../fonts.css" rel="stylesheet">
  <script src="../lucide.min.js"></script>

  <style>
    :root {
      --oxford-blue: #0b1f3a;
      --oxford-gold: #c9a227;
      --oxford-cream: #f6f3ec;
      --sf-text-primary: #1d1d1f;
      --sf-text-secondary: #6e6e73;
      --sf-text-tertiary: #86868b;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--oxford-cream);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', 'Helvetica Neue', Arial, sans-serif;
      color: var(--sf-text-primary);
      font-weight: 400; font-size: 17px; line-height: 1.5;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    h1,h2,h3,h4,h5,h6 {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Noto Kufi Arabic', sans-serif;
      font-weight: 700; letter-spacing: -0.022em; color: var(--sf-text-primary); margin: 0;
    }
    p, span, a, li, div {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', sans-serif;
      font-weight: 400; letter-spacing: -0.01em;
    }

    .hero-bg {
      background:
        linear-gradient(rgba(11,31,58,0.88), rgba(11,31,58,0.94)),
        url('../../logo.jfif') center/cover no-repeat;
    }
    .gold-line {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--oxford-gold), transparent);
    }
    .notice {
      position: fixed; top: 14px; left: 14px; z-index: 50;
      background: rgba(11,31,58,0.95); color: var(--oxford-gold);
      border: 1px solid var(--oxford-gold); border-radius: 9999px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex; align-items: center; gap: 6px;
    }
    .crest {
      width: 72px; height: 72px; object-fit: contain;
      border-radius: 50%; background: #fff; padding: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border: 2px solid var(--oxford-gold);
    }
    .hero-title {
      font-weight: 800; letter-spacing: -0.03em; color: #fff;
    }
    .hero-subtitle {
      font-weight: 400; letter-spacing: -0.01em; color: rgba(255,255,255,0.82);
    }

    /* صندوق البحث */
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid rgba(11,31,58,0.08);
      border-radius: 16px;
      padding: 0 14px;
      box-shadow: 0 2px 10px rgba(11,31,58,0.05);
      transition: all .25s ease;
    }
    .search-wrap:focus-within {
      border-color: var(--oxford-gold);
      box-shadow: 0 4px 20px rgba(201,162,39,0.18);
    }
    .search-wrap svg {
      color: var(--sf-text-tertiary);
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 14px 12px;
      font-family: inherit;
      font-size: 15px;
      color: var(--sf-text-primary);
      letter-spacing: -0.01em;
    }
    .search-input::placeholder {
      color: var(--sf-text-tertiary);
    }
    .filter-select {
      background: #fff;
      border: 1px solid rgba(11,31,58,0.08);
      border-radius: 16px;
      padding: 13px 14px;
      font-family: inherit;
      font-size: 15px;
      color: var(--sf-text-primary);
      letter-spacing: -0.01em;
      outline: none;
      cursor: pointer;
      transition: all .25s ease;
      box-shadow: 0 2px 10px rgba(11,31,58,0.05);
      width: 100%;
    }
    .filter-select:focus {
      border-color: var(--oxford-gold);
      box-shadow: 0 4px 20px rgba(201,162,39,0.18);
    }

    /* بطاقة الدرس */
    .lesson-card {
      display: flex;
      align-items: stretch;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(11,31,58,0.06);
      box-shadow: 0 4px 16px rgba(11,31,58,0.06);
      text-decoration: none;
      color: inherit;
      transition: all .3s cubic-bezier(0.25, 0.1, 0.25, 1);
      position: relative;
      opacity: 0;
    }
    .lesson-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(11,31,58,0.12);
      border-color: rgba(201,162,39,0.4);
    }
    .lesson-card:active { transform: scale(0.99); }

    .thumb-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 140px;
      background: #000;
      overflow: hidden;
    }
    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(11,31,58,0.1), rgba(11,31,58,0.4));
      color: #fff;
      opacity: 0.85;
      transition: opacity .25s ease;
    }
    .play-overlay svg {
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }
    .lesson-card:hover .play-overlay {
      opacity: 1;
    }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }
    .card-badge {
      display: inline-block;
      background: rgba(201,162,39,0.12);
      color: var(--oxford-blue);
      border: 1px solid rgba(201,162,39,0.3);
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      width: fit-content;
    }
    .card-title {
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: -0.022em;
      color: var(--oxford-blue);
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .card-teacher {
      font-size: 13px;
      color: var(--sf-text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: -0.01em;
    }
    .card-teacher svg { color: var(--oxford-gold); }
    .card-date {
      font-size: 11.5px;
      color: var(--sf-text-tertiary);
      letter-spacing: -0.01em;
    }

    /* Ripple */
    .ripple::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(201,162,39,0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease, opacity 0.8s;
      opacity: 0;
      pointer-events: none;
    }
    .ripple:active::after {
      width: 400px; height: 400px;
      opacity: 1;
      transition: 0s;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-card {
      animation: slideUp 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 20px;
      color: var(--sf-text-secondary);
    }
    .empty-state svg {
      color: var(--oxford-gold);
      margin-bottom: 14px;
    }

    @media (max-width: 640px) {
      html, body { font-size: 16px; }
      .notice { font-size: 11px; padding: 6px 12px; }
      .crest { width: 64px; height: 64px; }
      .thumb-wrapper { width: 120px; }
      .card-title { font-size: 14.5px; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">


  <!-- الهيدر -->
  <header class="hero-bg text-white">
    <div class="max-w-2xl mx-auto px-5 py-8 flex flex-col items-center text-center">

      <a href="../index.html" class="mb-4">
        <img src="../../logo.jfif" alt="شعار منصة طالب" class="crest">
      </a>

      <h1 class="hero-title text-3xl sm:text-4xl">دروس اليوتيوب</h1>
      <div class="gold-line w-28 my-3"></div>
      <p class="hero-subtitle text-sm sm:text-base max-w-md leading-relaxed">
        مكتبة الفيديوهات التعليمية وفق المناهج الدراسية
      </p>

    </div>
  </header>

  <!-- المحتوى -->
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-6">

    <!-- أدوات البحث والفلترة -->
    <div class="flex flex-col gap-3 mb-6">

      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text"
               id="searchBox"
               class="search-input"
               placeholder="ابحث عن درس أو أستاذ أو مادة..."
               autocomplete="off">
      </div>

      <div class="flex items-center justify-between gap-3">
        <select id="subjectFilter" class="filter-select">
          <option value="">كل المواد</option>
        </select>
        <span id="resultsCount" class="text-xs whitespace-nowrap" style="color: var(--sf-text-tertiary); font-weight: 600;"></span>
      </div>

    </div>

    <!-- قائمة الدروس -->
    <div id="lessonsContainer" class="flex flex-col gap-3"></div>

    <!-- حالة فارغة -->
    <div id="emptyState" class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <h3 class="text-lg font-bold mb-1" style="color: var(--oxford-blue);">لا توجد نتائج</h3>
      <p class="text-sm">جرّب كلمة بحث أخرى أو غيّر فلتر المادة.</p>
    </div>

  </main>

  <!-- الحقوق -->
  <footer class="bg-[#081729] text-gray-300 py-6 text-center text-sm px-4 mt-4">
    <div class="gold-line w-32 mx-auto mb-4"></div>
    <p>© <span id="year"></span> منصة طالب — جميع الحقوق محفوظة</p>
    <p class="mt-1 text-xs text-gray-400">تأسيس: الأستاذ مصطفى رحيم فندي</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <!-- قاعدة البيانات + منطق البحث -->
  <script src="db_links_videos.js"></script>
  <script src="search.js"></script>
  <script>lucide.createIcons();</script>

</body>
</html>
