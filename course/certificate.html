<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1f3a">
    <title>إدخال الاسم للشهادة | منصة طالب</title>
    <meta name="description" content="أدخل اسمك للحصول على شهادة إتمام الكورس من منصة طالب.">
    <meta name="author" content="الأستاذ مصطفى رحيم فندي">
    <meta name="robots" content="noindex, follow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/dist/tailwind.css">
      <link rel="stylesheet" href="../webfonts/fontawesome-free-6.5.2-web/css/all.min.css">


    <style>
        :root {
            --oxford-blue: #0b1f3a;
            --oxford-blue-deep: #081729;
            --oxford-gold: #c9a227;
            --oxford-gold-dark: #b8911f;
            --oxford-cream: #f6f3ec;
            --sf-text-primary: #1d1d1f;
            --sf-text-secondary: #6e6e73;
            --sf-text-tertiary: #86868b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--oxford-cream);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', 'Helvetica Neue', Arial, sans-serif;
            color: var(--sf-text-primary);
            font-weight: 400;
            font-size: 17px;
            line-height: 1.5;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Noto Kufi Arabic', sans-serif;
            font-weight: 700;
            letter-spacing: -0.022em;
            color: var(--sf-text-primary);
            margin: 0;
        }

        p, span, a, li, div, button, input, label {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', sans-serif;
            letter-spacing: -0.01em;
        }

        /* ====== الإشعار ====== */
        .notice {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 100;
            background: rgba(11,31,58,0.95);
            color: var(--oxford-gold);
            border: 1px solid var(--oxford-gold);
            border-radius: 9999px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gold-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--oxford-gold), transparent);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 10px;
        }

        /* ====== رأس الشعار ====== */
        .logo-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .crest {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            padding: 6px;
            box-shadow: 0 8px 30px rgba(11,31,58,0.25);
            border: 2px solid var(--oxford-gold);
            margin: 0 auto 14px;
            display: block;
        }

        .logo-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, var(--oxford-gold), #e6c34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            display: block;
        }

        .logo-subtitle {
            color: var(--sf-text-secondary);
            font-size: 15px;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        /* ====== بطاقة إدخال الاسم ====== */
        .name-card {
            background: #ffffff;
            border: 1px solid rgba(11,31,58,0.06);
            border-radius: 22px;
            padding: 36px 28px;
            box-shadow: 0 8px 32px rgba(11,31,58,0.08);
            animation: fadeIn 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .name-card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--oxford-gold), transparent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ====== رأس البطاقة ====== */
        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .trophy-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(201,162,39,0.18), rgba(201,162,39,0.06));
            border: 1px solid rgba(201,162,39,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .trophy-icon i {
            font-size: 32px;
            color: var(--oxford-gold);
        }

        .card-header h2 {
            color: var(--oxford-blue);
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .card-header p {
            color: var(--sf-text-secondary);
            font-size: 15px;
        }

        /* ====== حقل الإدخال ====== */
        .input-group {
            margin: 22px 0;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            color: var(--oxford-blue);
            font-weight: 600;
            font-size: 14px;
            text-align: right;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: #faf8f3;
            border: 2px solid rgba(11,31,58,0.1);
            border-radius: 14px;
            font-size: 17px;
            color: var(--oxford-blue);
            font-family: inherit;
            text-align: right;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--oxford-gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(201,162,39,0.15);
        }

        .input-field::placeholder {
            color: var(--sf-text-tertiary);
            font-family: inherit;
        }

        /* ====== صندوق المعلومات ====== */
        .info-box {
            background: linear-gradient(135deg, rgba(201,162,39,0.1), rgba(201,162,39,0.04));
            border: 1px solid rgba(201,162,39,0.3);
            border-right: 4px solid var(--oxford-gold);
            border-radius: 14px;
            padding: 18px;
            margin: 22px 0;
            text-align: center;
        }

        .info-icon {
            color: var(--oxford-gold);
            margin-left: 8px;
            font-size: 18px;
        }

        .info-text {
            color: var(--oxford-blue);
            font-size: 15px;
            font-weight: 600;
        }

        .score-value {
            color: var(--oxford-gold-dark);
            font-weight: 800;
            font-size: 18px;
            margin-right: 4px;
        }

        /* ====== معلومات الكورس ====== */
        .course-info {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed rgba(11,31,58,0.12);
        }

        .course-title {
            color: var(--oxford-blue);
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
        }

        .course-details {
            color: var(--sf-text-secondary);
            font-size: 13px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .course-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-icon {
            color: var(--oxford-gold);
            font-size: 13px;
        }

        /* ====== الأزرار ====== */
        .button-group {
            margin-top: 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            text-decoration: none;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background: var(--oxford-gold);
            color: #fff;
            box-shadow: 0 4px 14px rgba(201,162,39,0.35);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--oxford-gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201,162,39,0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: transparent;
            color: var(--oxford-blue);
            border: 2px solid rgba(11,31,58,0.15);
        }

        .btn-secondary:hover {
            background: rgba(201,162,39,0.08);
            border-color: var(--oxford-gold);
            color: var(--oxford-gold-dark);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-icon {
            font-size: 16px;
        }

        /* ====== رسالة الخطأ ====== */
        .error-message {
            color: #d33333;
            font-size: 13px;
            margin-top: 8px;
            text-align: right;
            display: none;
            animation: fadeIn 0.3s ease;
            font-weight: 600;
        }

        /* ====== الحقوق ====== */
        .footer {
            margin-top: 24px;
            text-align: center;
        }

        .footer p {
            color: var(--sf-text-tertiary);
            font-size: 12px;
            line-height: 1.7;
        }

        .footer strong {
            color: var(--oxford-blue);
            font-weight: 600;
        }

        /* ====== Responsive ====== */
        @media (max-width: 640px) {
            html, body {
                padding: 15px;
                font-size: 16px;
                align-items: flex-start;
            }

            .container {
                padding: 6px;
            }

            .name-card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            .card-header h2 {
                font-size: 19px;
            }

            .input-field {
                font-size: 16px;
                padding: 12px 14px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 14px;
            }

            .logo-text {
                font-size: 28px;
            }

            .trophy-icon {
                width: 60px;
                height: 60px;
                border-radius: 16px;
            }

            .trophy-icon i {
                font-size: 26px;
            }

            .notice {
                font-size: 11px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 380px) {
            .name-card {
                padding: 22px 16px;
            }

            .card-header h2 {
                font-size: 17px;
            }

            .input-field {
                font-size: 15px;
            }

            .btn {
                padding: 11px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>



    <div class="container">

        <!-- رأس الشعار -->
        <div class="logo-header">
            <img src="../logo.jfif" alt="شعار منصة طالب" class="crest"
                 onerror="this.style.display='none'">
            <span class="logo-text">منصة طالب</span>
            <div class="logo-subtitle">منصة تعليمية مدرسية</div>
            <div class="gold-line" style="width: 100px; margin: 10px auto 0;"></div>
        </div>

        <!-- بطاقة إدخال الاسم -->
        <div class="name-card">

            <div class="card-header">
                <div class="trophy-icon">
                    <i class="fas fa-trophy"></i>
                </div>
                <h2>تهانينا على إكمال الكورس! 🎉</h2>
                <p>أدخل اسمك للحصول على شهادتك الرقمية</p>
            </div>

            <div class="input-group">
                <label for="studentName" class="input-label">
                    الاسم الكامل للشهادة
                </label>
                <input type="text"
                       id="studentName"
                       class="input-field"
                       placeholder="أدخل اسمك باللغة العربية"
                       autocomplete="off"
                       autofocus>
                <div id="nameError" class="error-message">
                    الرجاء إدخال اسم صحيح (3 أحرف على الأقل)
                </div>
            </div>

            <div class="info-box">
                <div class="info-text">
                    <i class="fas fa-award info-icon"></i>
                    لقد حصلت على نسبة نجاح:
                    <span class="score-value" id="scoreDisplay">90%</span>
                </div>
            </div>

            <div class="course-info">
                <div class="course-title" id="courseTitle">اسم الكورس</div>
                <div class="course-details">
                    <div class="course-detail-item">
                        <i class="fas fa-calendar detail-icon"></i>
                        <span id="courseDate">١ يناير ٢٠٢٤</span>
                    </div>
                    <div class="course-detail-item">
                        <i class="fas fa-map-marker-alt detail-icon"></i>
                        <span id="courseCountry">العراق</span>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="generateBtn" class="btn btn-primary" onclick="generateCertificate()">
                    <i class="fas fa-certificate btn-icon"></i>
                    إنشاء الشهادة
                </button>

                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-home btn-icon"></i>
                    العودة للرئيسية
                </a>

                <a href="certificates.html" class="btn btn-secondary">
                    <i class="fas fa-certificate btn-icon"></i>
                    جميع شهاداتي
                </a>
            </div>
        </div>

        <!-- الحقوق -->
        <div class="footer">
            <div class="gold-line" style="width: 120px; margin: 0 auto 12px;"></div>
            <p>© <span id="year"></span> منصة طالب — جميع الحقوق محفوظة</p>
            <p>تأسيس: <strong>الأستاذ مصطفى رحيم فندي</strong></p>
        </div>
    </div>

    <!-- السكربتات (كما هي - بدون تغيير) -->
    <script src="../visitor.js"></script>
    <script src="send.js"></script>

    <script>
        // ============================================================
        // JavaScript - لم يتم تغيير أي منطق (فقط إضافة سنة الحقوق)
        // ============================================================

        document.getElementById('year').textContent = new Date().getFullYear();

        // جلب بيانات الشهادة الحالية
        let currentCertificate = null;
        let isProcessing = false;
        let hasBeenSent = false;

        document.addEventListener('DOMContentLoaded', function() {
            try {
                const pendingCert = localStorage.getItem('pendingCertificate');
                if (pendingCert) {
                    currentCertificate = JSON.parse(pendingCert);
                    displayCourseInfo();
                } else {
                    const urlParams = new URLSearchParams(window.location.search);
                    const certId = urlParams.get('id');

                    if (certId) {
                        loadCertificateById(certId);
                    } else {
                        window.location.href = 'index.html';
                    }
                }
            } catch (error) {
                console.error('خطأ في تحميل بيانات الشهادة:', error);
                showError('حدث خطأ في تحميل بيانات الشهادة');
            }

            const nameInput = document.getElementById('studentName');
            const generateBtn = document.getElementById('generateBtn');
            const nameError = document.getElementById('nameError');

            nameInput.addEventListener('input', function() {
                validateNameInput();
            });

            nameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    generateCertificate();
                }
            });
        });

        function loadCertificateById(certificateId) {
            try {
                const certificates = JSON.parse(localStorage.getItem('userCertificates') || '[]');
                const certificate = certificates.find(cert => cert.certificateId === certificateId);

                if (certificate) {
                    currentCertificate = certificate;
                    displayCourseInfo();
                } else {
                    showError('الشهادة غير موجودة');
                    setTimeout(() => {
                        window.location.href = 'certificates.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('خطأ في تحميل الشهادة:', error);
                showError('حدث خطأ في تحميل الشهادة');
            }
        }

        function displayCourseInfo() {
            if (!currentCertificate) return;

            document.getElementById('scoreDisplay').textContent = `${currentCertificate.score}%`;
            document.getElementById('courseTitle').textContent = currentCertificate.courseTitle;
            document.getElementById('courseDate').textContent = currentCertificate.issueDate;
            document.getElementById('courseCountry').textContent = currentCertificate.country || 'العراق';

            if (currentCertificate.studentName) {
                document.getElementById('studentName').value = currentCertificate.studentName;
                validateNameInput();
            }
        }

        function validateNameInput() {
            const nameInput = document.getElementById('studentName');
            const nameError = document.getElementById('nameError');
            const generateBtn = document.getElementById('generateBtn');

            const name = nameInput.value.trim();

            if (name.length >= 3) {
                nameError.style.display = 'none';
                generateBtn.disabled = false;
                return true;
            } else {
                nameError.style.display = 'block';
                generateBtn.disabled = true;
                return false;
            }
        }

        async function generateCertificate() {
            if (!window.CERTIFICATE_HANDLER) {
                console.error('❌ CERTIFICATE_HANDLER غير موجود');
                showError('نظام الشهادات غير متوفر حالياً');
                return;
            }

            if (window.isGeneratingCertificate) {
                console.log('🔄 جاري إنشاء الشهادة حالياً...');
                return;
            }

            window.isGeneratingCertificate = true;

            if (!validateNameInput()) {
                window.isGeneratingCertificate = false;
                return;
            }

            if (!currentCertificate) {
                window.isGeneratingCertificate = false;
                showError('لا توجد بيانات شهادة متاحة');
                return;
            }

            const studentName = document.getElementById('studentName').value.trim();

            const certificateData = {
                ...currentCertificate,
                studentName: studentName,
                status: 'ACTIVE',
                updatedAt: new Date().toISOString()
            };

            if (!certificateData.courseNumber) {
                certificateData.courseNumber = generateCourseNumber(certificateData.courseTitle);
            }

            const alreadySentKey = `cert_sent_${certificateData.certificateId}`;
            const alreadySent = localStorage.getItem(alreadySentKey) === 'true';

            if (alreadySent) {
                console.log('✅ الشهادة أرسلت مسبقاً، الانتقال للعرض فقط');
                window.isGeneratingCertificate = false;
                window.location.href = `certificate_view.html?id=${certificateData.certificateId}`;
                return;
            }

            try {
                const certificates = JSON.parse(localStorage.getItem('userCertificates') || '[]');
                const existingIndex = certificates.findIndex(cert =>
                    cert.certificateId === certificateData.certificateId
                );

                if (existingIndex === -1) {
                    certificates.push(certificateData);
                } else {
                    certificates[existingIndex] = certificateData;
                }

                localStorage.setItem('userCertificates', JSON.stringify(certificates));
                localStorage.setItem('currentCertificate', JSON.stringify(certificateData));

                console.log('💾 بيانات الشهادة محفوظة محلياً:', certificateData.certificateId);

            } catch (error) {
                console.error('❌ خطأ في الحفظ المحلي:', error);
            }

            try {
                const sendResult = await window.CERTIFICATE_HANDLER.sendCertificateToSheets(certificateData);

                console.log('📤 نتيجة إرسال الشهادة:', sendResult);

                if (sendResult.success || sendResult.isDuplicate) {
                    localStorage.setItem(alreadySentKey, 'true');
                    localStorage.setItem(`cert_sent_time_${certificateData.certificateId}`, Date.now().toString());

                    console.log('✅ تم وضع علامة إرسال للشهادة:', certificateData.certificateId);

                } else {
                    console.log('⚠️ لم يتم إرسال الشهادة بنجاح، سيتم تخزينها للمحاولة لاحقاً');
                }

            } catch (error) {
                console.error('❌ خطأ في إرسال الشهادة:', error);
            }

            setTimeout(() => {
                localStorage.removeItem('pendingCertificate');
                window.location.href = `certificate_view.html?id=${certificateData.certificateId}`;
                window.isGeneratingCertificate = false;
            }, 1500);
        }

        function generateCourseNumber(courseTitle) {
            if (!courseTitle) return 'CS000';
            const words = courseTitle.split(' ');
            let courseNumber = 'CS';

            if (words.length >= 2) {
                courseNumber += words[0].substring(0, 2).toUpperCase();
                courseNumber += words[1].substring(0, 2).toUpperCase();
            } else {
                courseNumber += courseTitle.substring(0, 4).toUpperCase();
            }

            courseNumber += Math.floor(Math.random() * 900 + 100);
            return courseNumber;
        }

        function showSuccessMessage() {
            const generateBtn = document.getElementById('generateBtn');

            generateBtn.innerHTML = '<i class="fas fa-check btn-icon"></i> تم إنشاء الشهادة';
            generateBtn.style.background = 'linear-gradient(135deg, #06762f, #0a8f3b)';
            generateBtn.disabled = true;

            const nameCard = document.querySelector('.name-card');
            nameCard.style.animation = 'none';
            setTimeout(() => {
                nameCard.style.animation = 'fadeIn 0.7s cubic-bezier(0.25, 0.1, 0.25, 1)';
            }, 10);
        }

        function showError(message) {
            alert(message);
        }

        if (currentCertificate) {
            document.title = `شهادة ${currentCertificate.courseTitle} | منصة طالب`;
        }
    </script>

</body>
</html>
