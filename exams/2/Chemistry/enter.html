<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأساتذة وحول القسم | منصّتي</title>
  <link href="../../../package/dist/tailwind.css" rel="stylesheet">
  <link href="../../../fonts.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/scrollreveal"></script>
  <script src="text.js"></script>
</head>

<body class="bg-gradient-to-tr from-indigo-800 via-blue-700 to-cyan-600 min-h-screen flex flex-col text-gray-800 font-[Cairo]">

  <!-- رأس الصفحة -->
  <header class="text-center text-white mt-10 mb-4">
    <h1 class="text-4xl font-bold tracking-wide drop-shadow-xl animate-fadeInDown">👩‍🏫 الأساتذة والقسم</h1>
    <p class="text-white/80 mt-2 text-lg">منصة <span class="font-semibold">منصّتي التعليمية</span></p>
  </header>

  <!-- قسم الأساتذة -->
  <section class="px-6 mt-6">
    <h2 class="text-2xl font-semibold text-white mb-4">الأساتذة المشاركون</h2>
    <div id="teachersContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- سيتم توليد البطاقات هنا عبر JS -->
    </div>
  </section>

  <!-- حول الموضوع -->
  <section class="mt-12 px-6">
    <h2 class="text-2xl font-semibold text-white mb-4">حول الموضوع</h2>
    <div class="bg-white rounded-3xl p-6 shadow-xl leading-relaxed text-gray-800" id="topicBox">
      <p id="topicText" class="animate-fadeIn">يتم تحميل النص من ملف text.js ...</p>
    </div>
  </section>

  <!-- زر العودة -->
  <div class="flex justify-center mt-10 mb-6">
    <button onclick="location.href='../subjects.html'"
      class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white px-12 py-3 rounded-full font-semibold shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:scale-105 active:scale-95">
      ⬅ العودة إلى قائمة المواد
    </button>
  </div>

  <!-- Footer -->
  <footer class="text-center text-white/80 text-sm mb-6 animate-fadeInUp">
    <p>قام بتطوير المنصة وبرمجتها <span class="font-semibold text-white">الأستاذ مصطفى حيم فندي</span></p>
    <p>© <span id="year"></span> جميع الحقوق محفوظة | <span class="font-semibold">منصّتي</span></p>
  </footer>

  <!-- ملفات JS -->
 
  <script src="teachers.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const container = document.getElementById("teachersContainer");

    teachers.forEach(teacher => {
      const card = document.createElement("div");
      card.className = "bg-white rounded-3xl p-6 shadow-xl text-center transform transition hover:-translate-y-2 hover:shadow-2xl duration-300 cursor-pointer";
      card.onclick = () => { window.location.href = teacher.link; };
      card.innerHTML = `
        <img src="${teacher.image}" alt="${teacher.name}" class="w-24 h-24 rounded-full border-4 border-blue-500 mx-auto mb-3">
        <h3 class="font-bold text-gray-800 text-lg">${teacher.name}</h3>
        <p class="text-sm text-gray-600 mt-1">اختصاص: ${teacher.specialty}</p>
        <p class="text-sm text-gray-500">${teacher.school}</p>
      `;
      container.appendChild(card);
    });

    // ScrollReveal
    ScrollReveal().reveal('header', { duration: 1000, distance: '20px', origin: 'top', easing: 'ease-out' });
    ScrollReveal().reveal('.bg-white\\/90', { interval: 200, duration: 800, distance: '30px', origin: 'bottom' });
    ScrollReveal().reveal('#topicBox', { duration: 1000, distance: '20px', origin: 'bottom' });
  </script>

  <!-- Animations -->
  <style>
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeInDown { animation: fadeInDown 0.9s ease-out; }
    .animate-fadeInUp { animation: fadeInUp 0.9s ease-out; }
    .animate-fadeIn { animation: fadeInUp 1s ease-in-out; }
  </style>

</body>
</html>
