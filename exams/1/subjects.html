<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>أقسام المواد الدراسية | منصة طالب</title>
  <meta name="description" content="اختر المادة الدراسية في منصة طالب — إسلامية، عربي، إنجليزي، اجتماعيات، رياضيات، فيزياء، كيمياء، حاسوب.">
  <meta name="keywords" content="المواد الدراسية, منصة طالب, مناهج عراقية, إسلامية, عربي, إنجليزي, رياضيات, فيزياء, كيمياء, حاسوب">
  <meta name="author" content="الأستاذ مصطفى رحيم فندي">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://talib.edu/subjects">

  <!-- Open Graph -->
  <meta property="og:title" content="أقسام المواد الدراسية | منصة طالب">
  <meta property="og:description" content="اختر المادة التي ترغب بدخولها.">
  <meta property="og:image" content="../../logo.jfif">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">

  <link rel="icon" type="image/png" href="../../logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="../../package/dist/tailwind.css" rel="stylesheet">
  <link href="../../fonts.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --oxford-blue: #0b1f3a;
      --oxford-gold: #c9a227;
      --oxford-cream: #f6f3ec;
      --sf-text-primary: #1d1d1f;
      --sf-text-secondary: #6e6e73;
      --sf-text-tertiary: #86868b;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--oxford-cream);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', 'Helvetica Neue', Arial, sans-serif;
      color: var(--sf-text-primary);
      font-weight: 400; font-size: 17px; line-height: 1.5;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    h1,h2,h3,h4,h5,h6 {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Noto Kufi Arabic', sans-serif;
      font-weight: 700; letter-spacing: -0.022em; color: var(--sf-text-primary); margin: 0;
    }
    p, span, a, li, div {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Noto Kufi Arabic', sans-serif;
      font-weight: 400; letter-spacing: -0.01em;
    }

    .hero-bg {
      background:
        linear-gradient(rgba(11,31,58,0.88), rgba(11,31,58,0.94)),
        url('../../logo.jfif') center/cover no-repeat;
    }
    .gold-line {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--oxford-gold), transparent);
    }
    .notice {
      position: fixed; top: 14px; left: 14px; z-index: 50;
      background: rgba(11,31,58,0.95); color: var(--oxford-gold);
      border: 1px solid var(--oxford-gold); border-radius: 9999px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex; align-items: center; gap: 6px;
    }
    .crest {
      width: 72px; height: 72px; object-fit: contain;
      border-radius: 50%; background: #fff; padding: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border: 2px solid var(--oxford-gold);
    }
    .hero-title {
      font-weight: 800; letter-spacing: -0.03em; color: #fff;
    }
    .hero-subtitle {
      font-weight: 400; letter-spacing: -0.01em; color: rgba(255,255,255,0.82);
    }

    /* بطاقات المواد */
    .subject-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 14px;
      border: 1px solid rgba(11,31,58,0.06);
      box-shadow: 0 4px 16px rgba(11,31,58,0.06);
      transition: all .35s cubic-bezier(0.25, 0.1, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .subject-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 32px rgba(11,31,58,0.12);
      border-color: rgba(201,162,39,0.4);
    }
    .subject-card:active { transform: scale(0.98); }

    .subject-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(201,162,39,0.18), rgba(201,162,39,0.06));
      border: 1px solid rgba(201,162,39,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: all .3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .subject-card:hover .subject-icon {
      transform: rotate(-6deg) scale(1.06);
      background: linear-gradient(135deg, rgba(201,162,39,0.28), rgba(201,162,39,0.12));
    }
    .subject-icon svg {
      width: 30px;
      height: 30px;
      color: var(--oxford-gold);
      stroke-width: 2;
    }
    .subject-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Noto Kufi Arabic', sans-serif;
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: -0.022em;
      color: var(--oxford-blue);
      margin: 0;
    }

    /* Ripple */
    .ripple::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(201,162,39,0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s ease, height 0.5s ease, opacity 0.8s;
      opacity: 0;
      pointer-events: none;
    }
    .ripple:active::after {
      width: 400px; height: 400px;
      opacity: 1;
      transition: 0s;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card {
      opacity: 0;
      animation: slideUp 0.55s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.12s; }
    .delay-3 { animation-delay: 0.19s; }
    .delay-4 { animation-delay: 0.26s; }
    .delay-5 { animation-delay: 0.33s; }
    .delay-6 { animation-delay: 0.40s; }
    .delay-7 { animation-delay: 0.47s; }
    .delay-8 { animation-delay: 0.54s; }

    @media (max-width: 640px) {
      html, body { font-size: 16px; }
      .notice { font-size: 11px; padding: 6px 12px; }
      .crest { width: 64px; height: 64px; }
      .subject-card { padding: 18px 10px; border-radius: 18px; }
      .subject-icon { width: 56px; height: 56px; border-radius: 16px; }
      .subject-icon svg { width: 26px; height: 26px; }
      .subject-title { font-size: 14.5px; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">



  <!-- الهيدر -->
  <header class="hero-bg text-white">
    <div class="max-w-2xl mx-auto px-5 py-8 flex flex-col items-center text-center">

      <a href="../../index.html" class="mb-3">
        <img src="../../logo.jfif" alt="شعار منصة طالب" class="crest">
      </a>

      <h1 class="hero-title text-3xl sm:text-4xl">أقسام المواد الدراسية</h1>
      <div class="gold-line w-28 my-3"></div>
      <p class="hero-subtitle text-sm sm:text-base max-w-md leading-relaxed">
        اختر المادة التي ترغب بدخولها
      </p>

    </div>
  </header>

  <!-- المحتوى -->
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-8">

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">

      <!-- إسلامية -->
      <a href="Islamic_Studies/enter.html" class="subject-card ripple animate-card delay-1">
        <div class="subject-icon">
          <i data-lucide="moon-star"></i>
        </div>
        <p class="subject-title">إسلامية</p>
      </a>

      <!-- عربي -->
      <a href="Arabic/enter.html" class="subject-card ripple animate-card delay-2">
        <div class="subject-icon">
          <i data-lucide="book-open-text"></i>
        </div>
        <p class="subject-title">عربي</p>
      </a>

      <!-- إنجليزي -->
      <a href="English/enter.html" class="subject-card ripple animate-card delay-3">
        <div class="subject-icon">
          <i data-lucide="languages"></i>
        </div>
        <p class="subject-title">إنجليزي</p>
      </a>

      <!-- اجتماعيات -->
      <a href="Social_Studies/enter.html" class="subject-card ripple animate-card delay-4">
        <div class="subject-icon">
          <i data-lucide="globe-2"></i>
        </div>
        <p class="subject-title">اجتماعيات</p>
      </a>

      <!-- رياضيات -->
      <a href="Mathematics/enter.html" class="subject-card ripple animate-card delay-5">
        <div class="subject-icon">
          <i data-lucide="sigma"></i>
        </div>
        <p class="subject-title">رياضيات</p>
      </a>

      <!-- فيزياء -->
      <a href="Physics/enter.html" class="subject-card ripple animate-card delay-6">
        <div class="subject-icon">
          <i data-lucide="zap"></i>
        </div>
        <p class="subject-title">فيزياء</p>
      </a>

      <!-- كيمياء -->
      <a href="Chemistry/enter.html" class="subject-card ripple animate-card delay-7">
        <div class="subject-icon">
          <i data-lucide="flask-conical"></i>
        </div>
        <p class="subject-title">كيمياء</p>
      </a>

      <!-- حاسوب -->
      <a href="Computer/enter.html" class="subject-card ripple animate-card delay-8">
        <div class="subject-icon">
          <i data-lucide="monitor"></i>
        </div>
        <p class="subject-title">حاسوب</p>
      </a>

    </div>

  </main>

  <!-- الحقوق -->
  <footer class="bg-[#081729] text-gray-300 py-6 text-center text-sm px-4 mt-4">
    <div class="gold-line w-32 mx-auto mb-4"></div>
    <p>© <span id="year"></span> منصة طالب — جميع الحقوق محفوظة</p>
    <p class="mt-1 text-xs text-gray-400">تأسيس: الأستاذ مصطفى رحيم فندي</p>
  </footer>

  <script>
    lucide.createIcons();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
