<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Excel – مختبر الحاسوب الافتراضي | منصة طالب</title>
  <style>
    :root {
      --ac: #107c41;
      --acd: #0b5d31;
      --bg: #e6e6e6;
      --rib: #f3f2f1;
      --pn: #fff;
      --tx: #222;
      --ln: #d2d0ce;
      --hv: #e1dfdd;
      --on: #cde8d8;
      --hd: #e9e9e9;
      --gl: #d4d4d4;
      --st: #f3f2f1
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        --bg: #2b2b2b;
        --rib: #3a3a3a;
        --pn: #262626;
        --tx: #eee;
        --ln: #595959;
        --hv: #4a4a4a;
        --on: #1f5136;
        --hd: #3a3a3a;
        --gl: #444;
        --st: #2f2f2f
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-size: 13px;
      color: var(--tx);
      background: var(--bg);
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%
    }

    button,
    select,
    input,
    textarea {
      font-family: inherit;
      color: inherit
    }

    .tb {
      background: var(--ac);
      color: #fff;
      display: flex;
      align-items: center;
      height: 36px;
      padding: 0 6px;
      gap: 4px;
      flex: none
    }

    .logo {
      background: #fff;
      color: var(--ac);
      font: 800 15px Georgia, serif;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .qa {
      background: none;
      border: 0;
      color: #fff;
      width: 30px;
      height: 28px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 15px
    }

    .qa:hover {
      background: rgba(255, 255, 255, .22)
    }

    .ti {
      flex: 1;
      text-align: center;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tabs {
      background: var(--ac);
      display: flex;
      gap: 1px;
      padding: 0 6px;
      height: 32px;
      align-items: flex-end;
      overflow-x: auto;
      flex: none
    }

    .tab {
      padding: 6px 15px;
      color: #fff;
      cursor: pointer;
      border-radius: 5px 5px 0 0;
      white-space: nowrap;
      user-select: none
    }

    .tab:hover {
      background: rgba(255, 255, 255, .2)
    }

    .tab.act {
      background: var(--rib);
      color: var(--ac);
      font-weight: 600
    }

    .tab.ex {
      background: #0a4d8c
    }

    .tab.ex.act {
      background: var(--rib);
      color: #0a4d8c
    }

    .rib {
      background: var(--rib);
      border-bottom: 1px solid var(--ln);
      height: 104px;
      overflow-x: auto;
      overflow-y: hidden;
      flex: none
    }

    .pnl {
      display: none;
      height: 100%;
      width: max-content;
      min-width: 100%
    }

    .pnl.act {
      display: flex
    }

    .grp {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--ln);
      padding: 4px 8px 0
    }

    .gb {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 2px
    }

    .gl {
      text-align: center;
      font-size: 11px;
      opacity: .7;
      padding: 1px 0 3px
    }

    .btn {
      border: 1px solid transparent;
      background: none;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 27px;
      height: 27px;
      white-space: nowrap
    }

    .btn:hover {
      background: var(--hv);
      border-color: var(--ln)
    }

    .btn.on {
      background: var(--on);
      border-color: var(--ac)
    }

    .btn.big {
      flex-direction: column;
      height: 70px;
      min-width: 58px;
      font-size: 11px;
      gap: 2px;
      padding: 3px 6px
    }

    .btn.big .ic {
      font-size: 24px;
      line-height: 1.1
    }

    .btn.pri {
      background: #0a4d8c;
      color: #fff
    }

    .btn.dg {
      color: #d13438
    }

    .sel {
      height: 26px;
      border: 1px solid var(--ln);
      background: var(--pn);
      border-radius: 3px;
      padding: 0 3px
    }

    .hs {
      font-size: 11.5px;
      max-width: 220px;
      line-height: 1.4;
      white-space: normal;
      opacity: .85
    }

    #fbar {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--pn);
      border-bottom: 1px solid var(--ln);
      padding: 3px 6px;
      flex: none
    }

    #nb {
      width: 78px;
      height: 30px;
      border: 1px solid var(--ln);
      border-radius: 4px;
      text-align: center;
      background: var(--pn);
      direction: ltr;
      font-weight: 600
    }

    #fbar button {
      border: 1px solid var(--ln);
      background: var(--pn);
      border-radius: 4px;
      height: 30px;
      min-width: 30px;
      cursor: pointer;
      font-weight: 700
    }

    #fbar button.on {
      background: var(--on);
      border-color: var(--ac)
    }

    #fbar #ok {
      color: var(--ac);
      display: none
    }

    #fbar #no {
      color: #d13438;
      display: none
    }

    body.editing #ok,
    body.editing #no {
      display: block
    }

    #fi {
      flex: 1;
      min-width: 0;
      height: 30px;
      border: 1px solid var(--ln);
      border-radius: 4px;
      padding: 0 8px;
      background: var(--pn)
    }

    #fi:focus {
      outline: 2px solid var(--ac);
      outline-offset: -1px
    }

    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative
    }

    #gw {
      flex: 1;
      overflow: auto;
      background: var(--pn);
      position: relative;
      -webkit-overflow-scrolling: touch;
      min-width: 0
    }

    body.smode #gw {
      touch-action: none
    }

    #sbox {
      position: relative;
      width: max-content;
      min-width: 100%
    }

    #grid {
      border-collapse: collapse;
      table-layout: fixed;
      direction: rtl;
      background: var(--pn)
    }

    #grid td {
      border: 1px solid var(--gl);
      padding: 0 5px;
      overflow: hidden;
      white-space: nowrap;
      cursor: cell;
      background: var(--pn);
      color: var(--tx)
    }

    #grid th {
      background: var(--hd);
      color: var(--tx);
      font-weight: 500;
      border: 1px solid var(--gl);
      position: sticky;
      z-index: 3;
      user-select: none;
      font-size: 12px;
      cursor: pointer
    }

    #grid thead th {
      top: 0
    }

    #grid th.rn {
      right: 0;
      z-index: 2
    }

    #grid th.cn0 {
      right: 0;
      z-index: 4
    }

    #grid th.hl {
      background: var(--on);
      color: var(--acd);
      font-weight: 700
    }

    #grid td.sel {
      outline: 2px solid var(--ac);
      outline-offset: -2px;
      position: relative;
      z-index: 1
    }

    #grid td.rg {
      box-shadow: inset 0 0 0 200px rgba(16, 124, 65, .16)
    }

    #grid td.cov {
      display: none
    }

    #grid.frz tbody tr:first-child td {
      position: sticky;
      top: 30px;
      z-index: 1
    }

    .nogl #grid td {
      border-color: transparent
    }

    .nohd #grid thead,
    .nohd #grid .rn {
      display: none
    }

    #fh {
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--ac);
      border: 2px solid #fff;
      border-radius: 3px;
      display: none;
      z-index: 6;
      touch-action: none;
      cursor: crosshair
    }

    .chart {
      position: absolute;
      background: var(--pn);
      border: 1px solid var(--ln);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
      border-radius: 4px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      direction: ltr
    }

    .chd {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--hd);
      padding: 2px 4px;
      cursor: move;
      touch-action: none;
      font-size: 12px;
      font-weight: 600;
      direction: rtl
    }

    .chd span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .chd button {
      border: 0;
      background: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      touch-action: manipulation
    }

    .cbd {
      flex: 1;
      min-height: 0;
      overflow: hidden
    }

    .cbd svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .crs {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 18px;
      height: 18px;
      background: var(--ac);
      cursor: nwse-resize;
      border-radius: 3px;
      touch-action: none
    }

    #stat {
      background: var(--st);
      border-top: 1px solid var(--ln);
      height: 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px;
      font-size: 12px;
      flex: none;
      overflow: hidden;
      white-space: nowrap
    }

    #stat .sp {
      flex: 1
    }

    #stat button {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      padding: 0 6px
    }

    #sheets {
      background: var(--st);
      border-top: 1px solid var(--ln);
      display: flex;
      overflow-x: auto;
      flex: none;
      height: 34px;
      align-items: stretch
    }

    .sh {
      padding: 0 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      white-space: nowrap;
      border-left: 1px solid var(--ln);
      user-select: none
    }

    .sh.act {
      background: var(--pn);
      color: var(--ac);
      font-weight: 700;
      box-shadow: inset 0 -3px 0 var(--ac)
    }

    .sh.add {
      font-size: 18px;
      color: var(--ac);
      font-weight: 700
    }

    #exp {
      width: 330px;
      background: var(--pn);
      border-right: 1px solid var(--ln);
      display: none;
      flex-direction: column;
      flex: none
    }

    body.exam #exp {
      display: flex
    }

    .eh {
      background: #0a4d8c;
      color: #fff;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer
    }

    .eh .l {
      flex: 1;
      min-width: 0;
      font-weight: 700
    }

    .eh small {
      display: block;
      font-weight: 400
    }

    .eb {
      flex: 1;
      overflow: auto;
      padding: 10px 12px
    }

    .goal {
      background: #fff4d6;
      color: #5a3d00;
      border: 1px solid #f1dd9a;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      line-height: 1.6
    }

    .pg {
      height: 8px;
      background: var(--hv);
      border-radius: 4px;
      overflow: hidden
    }

    .pg i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ac);
      transition: width .3s
    }

    .cr {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
      counter-reset: c
    }

    .cr li {
      counter-increment: c;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      margin-bottom: 7px;
      line-height: 1.5
    }

    .cr li:before {
      content: counter(c);
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #999;
      color: #fff;
      text-align: center;
      line-height: 22px;
      font-size: 12px;
      font-weight: 700
    }

    .cr li.d {
      background: rgba(16, 124, 65, .14);
      border-color: #5cb67f
    }

    .cr li.d:before {
      content: "✓";
      background: var(--ac)
    }

    .pt {
      font-size: 11px;
      background: rgba(43, 87, 154, .2);
      border-radius: 10px;
      padding: 0 7px;
      margin-right: 6px
    }

    .hb {
      background: none;
      border: 0;
      color: #3a8ee6;
      cursor: pointer;
      display: block;
      padding: 0;
      margin-top: 3px;
      font-size: 12px
    }

    .hn {
      display: none;
      font-size: 12px;
      background: #fff4d6;
      color: #7a4b00;
      border-radius: 4px;
      padding: 4px 7px;
      margin-top: 3px
    }

    .hn.show {
      display: block
    }

    .ef {
      padding: 10px;
      border-top: 1px solid var(--ln);
      display: flex;
      gap: 6px
    }

    #pop {
      position: fixed;
      display: none;
      background: var(--pn);
      border: 1px solid var(--ln);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
      border-radius: 6px;
      z-index: 80;
      max-height: 70vh;
      overflow: auto;
      min-width: 150px
    }

    .mi {
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap
    }

    .mi:hover {
      background: var(--hv)
    }

    .pgd {
      display: grid;
      grid-template-columns: repeat(6, 26px);
      gap: 4px;
      padding: 8px
    }

    .pgd i {
      height: 26px;
      border: 1px solid #888;
      border-radius: 3px;
      cursor: pointer
    }

    .gal {
      display: grid;
      grid-template-columns: repeat(3, 92px);
      gap: 8px;
      padding: 10px
    }

    .gi {
      border: 1px solid var(--ln);
      border-radius: 5px;
      height: 62px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      gap: 2px;
      text-align: center
    }

    .gi:hover {
      border-color: var(--ac)
    }

    .gi b {
      font-size: 20px
    }

    .bd {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100
    }

    .bd.show {
      display: flex
    }

    .md {
      background: var(--pn);
      border-radius: 10px;
      width: min(760px, 95vw);
      max-height: 92vh;
      overflow: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .4)
    }

    .mh {
      background: var(--ac);
      color: #fff;
      padding: 12px 16px;
      font-weight: 600
    }

    .mbd {
      padding: 14px;
      line-height: 1.7
    }

    .mbd label {
      display: block;
      font-weight: 600;
      margin: 8px 0 3px
    }

    .mbd input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--ln);
      border-radius: 5px;
      padding: 0 8px;
      background: var(--pn)
    }

    .mf {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid var(--ln);
      position: sticky;
      bottom: 0;
      background: var(--pn)
    }

    .mb {
      border: 1px solid var(--ln);
      background: var(--hv);
      border-radius: 6px;
      padding: 7px 16px;
      cursor: pointer;
      min-height: 36px
    }

    .mb.pri {
      background: var(--ac);
      color: #fff;
      border-color: var(--acd)
    }

    .mb.gr {
      background: #0a4d8c;
      color: #fff
    }

    .ec {
      border: 1px solid var(--ln);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden
    }

    .eh2 {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--hv)
    }

    .eh2 .i {
      font-size: 26px
    }

    .eh2 .t {
      flex: 1
    }

    .eh2 small {
      display: block;
      opacity: .7
    }

    .es {
      font-size: 24px;
      font-weight: 800
    }

    .tr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-top: 1px solid var(--ln)
    }

    .pl {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: var(--ac);
      color: #fff;
      cursor: pointer;
      font-size: 14px
    }

    .tr .t {
      flex: 1;
      min-width: 0
    }

    .tr small {
      display: block;
      opacity: .75;
      font-size: 12px
    }

    .bg {
      min-width: 42px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--hv);
      font-weight: 700
    }

    .ef2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-top: 1px solid var(--ln);
      font-size: 12.5px
    }

    .sc {
      text-align: center;
      margin: 8px 0
    }

    .sc .n {
      font-size: 50px;
      font-weight: 800;
      line-height: 1
    }

    .rt {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px
    }

    .rt td,
    .rt th {
      border: 1px solid var(--ln);
      padding: 5px 8px;
      text-align: right
    }

    .ok {
      color: var(--ac);
      font-weight: 700
    }

    .no {
      color: #d13438;
      font-weight: 700
    }

    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 9px 18px;
      border-radius: 6px;
      z-index: 200;
      display: none;
      max-width: 90vw;
      text-align: center
    }

    @media(max-width:760px) {

      html,
      body {
        overscroll-behavior: none
      }

      #app {
        height: 100dvh
      }

      body {
        padding: 0
      }

      .tb {
        order: 1;
        height: calc(50px + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) 6px 0
      }

      .qa {
        width: 42px;
        height: 42px;
        font-size: 20px
      }

      .logo {
        display: none
      }

      .ti {
        font-size: 14px;
        font-weight: 600
      }

      #fbar {
        order: 2;
        padding: 4px 6px
      }

      #nb {
        width: 70px;
        height: 38px;
        font-size: 15px
      }

      #fbar button {
        height: 38px;
        min-width: 38px
      }

      #fi {
        height: 38px;
        font-size: 16px
      }

      .main {
        order: 3;
        flex-direction: column
      }

      #exp {
        width: 100%;
        max-height: 40%;
        border-right: 0;
        border-top: 1px solid var(--ln);
        flex: none
      }

      #exp.col .eb,
      #exp.col .ef {
        display: none
      }

      #stat {
        order: 4
      }

      #sheets {
        order: 5;
        height: 40px
      }

      .rib {
        order: 6;
        height: auto;
        min-height: 68px;
        border-bottom: 0;
        border-top: 1px solid var(--ln)
      }

      .tabs {
        order: 7;
        height: auto;
        background: var(--pn);
        padding: 0 0 env(safe-area-inset-bottom, 0px);
        border-top: 1px solid var(--ln);
        gap: 0;
        align-items: stretch
      }

      .tab {
        flex: 1 0 auto;
        min-width: 60px;
        color: var(--tx);
        padding: 6px 8px;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 11px;
        text-align: center
      }

      .tab::before {
        content: attr(data-i);
        font-size: 20px;
        line-height: 1.15
      }

      .tab:hover {
        background: var(--hv)
      }

      .tab.act {
        background: var(--on);
        color: var(--ac);
        box-shadow: inset 0 3px 0 var(--ac)
      }

      .tab.ex,
      .tab.ex.act {
        color: #0a4d8c
      }

      .tab.ex {
        background: none
      }

      .tab.ex.act {
        background: rgba(10, 77, 140, .16);
        box-shadow: inset 0 3px 0 #0a4d8c
      }

      .pnl.act {
        align-items: center;
        height: auto;
        padding: 4px 2px
      }

      .grp {
        flex-direction: row;
        padding: 2px 6px
      }

      .gl,
      .hs {
        display: none
      }

      .btn {
        min-width: 46px;
        height: 46px;
        font-size: 17px

        $('#mbd').onclick = ev => { const p = ev.target.closest('[data-play]'); if (p) { const [a, i] = p.dataset.play.split('|'); closeM(); start(a, +i, 'single'); return } const al = ev.target.closest('[data-all]'); if (al) { closeM(); start(al.dataset.all, 0, 'full') } }
      }
      function cfgModal(cb) { modal('⚙ إعدادات الاختبار', '<label>اسم الطالب</label><input id="nm" value="' + esc(cfg.name) + '"><label>مؤقت لكل مهمة (بالدقائق، 0 = بدون)</label><input id="mn" type="number" min="0" max="120" value="' + cfg.min + '">', [{ l: 'حفظ', c: 'pri', f: () => { const v = $('#nm').value.trim(); if (!v) { toast('اكتب اسمك'); return false } cfg.name = v; cfg.min = Math.max(0, Math.min(120, +$('#mn').value || 0)); LS.s('xl_cfg', cfg); setTimeout(cb || catalog, 0) } }, { l: 'إلغاء' }]) }
      function start(eid, i, mode) {
        if (!cfg.name) { cfgModal(() => start(eid, i, mode)); return }
        const go = () => { Object.assign(ex, { active: true, e: EXAMS.find(x => x.id === eid), idx: i, mode, scores: [] }); load() };
        if (ex.active && !ex.sub) yesM('توجد مهمة جارية. هل تريد إلغاءها؟', go); else go()
      }
      function load() { const t = ex.e.tasks[ex.idx], S = mkSheet('ورقة1'); S.cells = t.st(); D = { sheets: [S], active: 0 }; resetSel(); flags = {}; hist = []; redo = []; ex.sub = false; ex.t0 = Date.now(); document.body.classList.add('exam'); panel(); renderAll(); $('#runI').textContent = ex.e.title + ' › ' + t.title; clearInterval(ex.iv); ex.iv = setInterval(tick, 500); showTab('home') }
      function tick() { if (!ex.active || ex.sub) return; const u = Math.round((Date.now() - ex.t0) / 1000), m = $('#etm'), left = cfg.min ? cfg.min * 60 - u : null; if (m) m.textContent = left == null ? '⏱ ' + fmtT(u) : '⏱ ' + fmtT(Math.max(0, left)); if (left != null && left <= 0) { toast('انتهى الوقت — تم التسليم تلقائياً'); submit(true) } }
      function panel() {
        const t = ex.e.tasks[ex.idx]; $('#exp').innerHTML = '<div class="eh"><div class="l">' + esc(ex.e.icon + ' ' + ex.e.title) + ' › ' + esc(t.title) + '<small>👤 ' + esc(cfg.name) + (ex.mode === 'full' ? ' · المهمة ' + (ex.idx + 1) + ' من ' + ex.e.tasks.length : '') + '</small></div><div id="etm" style="font:700 16px Consolas,monospace">⏱ 00:00</div></div><div class="eb"><div class="goal">🎯 ' + esc(t.goal) + '</div><div class="pg"><i id="pgb"></i></div><div id="pgt" style="font-size:12px;margin-top:3px"></div><ol class="cr">' +
          t.crit.map((q, i) => '<li id="k' + i + '"><div>' + esc(q.t) + '<span class="pt">' + q.p + ' درجة</span><button class="hb" data-h="' + i + '">💡 تلميح</button><div class="hn" id="hn' + i + '">' + esc(q.h) + '</div></div></li>').join('') + '</ol></div><div class="ef" id="ef"><button class="mb gr" data-a="submit" style="flex:1">✔ تسليم المهمة</button><button class="mb" data-a="exit">خروج</button></div>'
      }
      function score() { const t = ex.e.tasks[ex.idx]; let s = 0; const r = t.crit.map(q => { let o = false; try { o = !!q.k() } catch (e) { } if (o) s += q.p; return o }); return { s, r } }
      function refreshEx() { if (!ex.active || ex.sub) return; const { s, r } = score(); r.forEach((o, i) => { const l = $('#k' + i); l && l.classList.toggle('d', o) }); const b = $('#pgb'); if (b) { b.style.width = s + '%'; $('#pgt').textContent = 'الدرجة الحالية: ' + s + ' / 100' } }
      function submit(force) {
        if (!ex.active) { toast('لا توجد مهمة جارية — اختر مهمة من الاختبارات'); return } if (ex.sub) { ex.show && ex.show(); return }
        const go = () => {
          if (editing) commit(); ex.sub = true; clearInterval(ex.iv); const { s, r } = score(), t = ex.e.tasks[ex.idx], used = Math.round((Date.now() - ex.t0) / 1000);
          ex.scores[ex.idx] = s; prog[ex.e.id] = prog[ex.e.id] || {}; prog[ex.e.id][t.id] = Math.max(s, prog[ex.e.id][t.id] || 0); LS.s('xl_prog', prog);
          const h = LS.g('xl_hist', []); h.unshift({ name: cfg.name, exam: ex.e.title, task: t.title, score: s, date: Date.now() }); LS.s('xl_hist', h.slice(0, 80));
          r.forEach((o, i) => { const l = $('#k' + i); l && l.classList.toggle('d', o) }); $('#ef').innerHTML = '<button class="mb gr" data-a="submit" style="flex:1">📋 عرض النتيجة</button><button class="mb" data-a="exit">خروج</button>';
          ex.show = () => result(s, r, used); ex.show()
        };
        if (force) go(); else yesM('هل تريد تسليم المهمة الآن؟', go)
      }
      function result(s, r, used) {
        const e = ex.e, t = e.tasks[ex.idx];
        const rows = t.crit.map((q, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(q.t) + '</td><td>' + (r[i] ? '<span class="ok">✓ ' + q.p + '</span>' : '<span class="no">✗ 0</span>') + ' / ' + q.p + '</td></tr>').join('');
        const b = '<div style="text-align:center;opacity:.7;font-size:12px">منصة طالب — مختبر الحاسوب الافتراضي</div><div><b>الطالب:</b> ' + esc(cfg.name) + '<br><b>الاختبار:</b> ' + esc(e.title) + ' › ' + esc(t.title) + '<br><b>الزمن:</b> ' + fmtT(used) + '</div><div class="sc"><div class="n" style="color:' + gc(s) + '">' + s + ' / 100</div><div style="font-size:20px;font-weight:700;color:' + gc(s) + '">' + grade(s) + '</div></div><div style="overflow-x:auto"><table class="rt"><tr><th>#</th><th>المعيار</th><th>الدرجة</th></tr>' + rows + '</table></div>';
        const btns = [];
        if (ex.mode === 'full') { if (ex.idx >= e.tasks.length - 1) btns.push({ l: '📋 نتيجة الاختبار', c: 'gr', f: () => { setTimeout(examResult, 0) } }); else btns.push({ l: 'المهمة التالية ▶', c: 'gr', f: () => { ex.idx++; load() } }) }
        else { btns.push({ l: '↻ إعادة', c: 'gr', f: () => { const a = e.id, i = ex.idx; endRun(); setTimeout(() => start(a, i, 'single'), 0) } }); btns.push({ l: '📋 الاختبارات', c: 'pri', f: () => { endRun(); setTimeout(catalog, 0) } }) }
        btns.push({ l: 'عرض العمل' }); modal('نتيجة المهمة', b, btns)
      }
      function examResult() {
        const e = ex.e, s = e.tasks.map((t, i) => ex.scores[i] || 0), tot = Math.round(s.reduce((a, b) => a + b, 0) / s.length);
        const h = LS.g('xl_hist', []); h.unshift({ name: cfg.name, exam: e.title, task: '', score: tot, date: Date.now() }); LS.s('xl_hist', h.slice(0, 80));
        modal('🏁 نتيجة الاختبار', '<div class="sc"><div class="n" style="color:' + gc(tot) + '">' + tot + ' / 100</div><div style="font-size:20px;font-weight:700">' + grade(tot) + '</div></div><table class="rt"><tr><th>#</th><th>المهمة</th><th>الدرجة</th></tr>' + e.tasks.map((t, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(t.title) + '</td><td><b>' + s[i] + '</b></td></tr>').join('') + '</table>', [{ l: '📋 الاختبارات', c: 'pri', f: () => { endRun(); setTimeout(catalog, 0) } }, { l: 'إغلاق', f: () => endRun() }])
      }
      function endRun() { clearInterval(ex.iv); ex.active = false; ex.sub = false; document.body.classList.remove('exam'); const r = $('#runI'); if (r) r.textContent = 'لا توجد مهمة جارية'; D = LS.g('xl_doc', null) || { sheets: [mkSheet('ورقة1')], active: 0 }; resetSel(); flags = {}; hist = []; renderAll() }
      function exitRun() { if (!ex.active) { toast('لا توجد مهمة جارية'); return } if (ex.sub) endRun(); else yesM('هل تريد الخروج؟ لن تُحتسب درجة هذه المهمة.', endRun) }
      function history() {
        closeM(); const h = LS.g('xl_hist', []);
        modal('📊 سجل النتائج', h.length ? '<div style="overflow-x:auto"><table class="rt"><tr><th>الطالب</th><th>الاختبار</th><th>الدرجة</th><th>التاريخ</th></tr>' + h.map(r => '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.exam) + (r.task ? ' › ' + esc(r.task) : ' (كامل)') + '</td><td><b style="color:' + gc(r.score) + '">' + r.score + '</b></td><td>' + new Date(r.date).toLocaleString('ar-IQ') + '</td></tr>').join('') + '</table></div>' : 'لا توجد نتائج بعد.',
          [{ l: 'مسح السجل', f: () => { setTimeout(() => yesM('مسح كل النتائج؟', () => { LS.s('xl_hist', []); prog = {}; LS.s('xl_prog', prog) }), 0) } }, { l: '🎓 الاختبارات', f: () => { setTimeout(catalog, 0) } }, { l: 'إغلاق', c: 'pri' }])
      }
      /* ---------- init ---------- */
      D = LS.g('xl_doc', null); if (!D || !D.sheets || !D.sheets.length) D = { sheets: [mkSheet('ورقة1')], active: 0 };
      uid = Math.max(1, ...D.sheets.flatMap(s => s.charts.map(x => x.id))) + 1;
      mkRibbon(); renderAll();
      if (window.ResizeObserver) new ResizeObserver(() => updateSel()).observe($('#gw'));
      $('#gw').addEventListener('scroll', () => { }, { passive: true });
      setTimeout(() => toast('أهلاً بك في Excel التعليمي — جرّب 🎓 الاختبار العملي أو ☰ ← قالب جاهز', 4000), 500);
    })();
  </script>
