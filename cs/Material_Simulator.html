<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<style>

</style></head><body>

</div>

const S="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");

const SET={a:[3,11,19,37,55,87],b:[4,12,20,38,56,88],n:[2,10,18,36,54,86,118],h:[9,17,35,53,85,117],m:[5,14,32,33,51,52],o:[1,6,7,8,15,16,34],p:[13,31,49,50,81,82,83,84,113,114,115,116]};

for(let z=1;z<=118;z++)E.push({s:S[z-1],n:N[z-1],mp:MP[z-1]||2000,bp:BP[z-1]||4000,c:cat(z)});
function pos(z){if(z==0)return[1,5];if(z==1)return[1,1];if(z==2)return[1,18];if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];if(z<=12)return[3,z-10];if(z<=18)return[3,z];if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];if(z<=56)return[6,z-54];if(z<=71)return[8,z-54];if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];if(z<=103)return[9,z-86];return[7,z-100]}
const $=id=>document.getElementById(id);
const LNMAX=Math.log(50000);
let lnT=Math.log(263),tgt=null,lnP=0,el=0,auto=true,hist=[],hacc=0,iacc=0;
let el2=-1,mixX=0,pickMode=0,E_=0,B_=0,W_=0,macro=true,zoom=false,expM=0;
const mix={k:70,c:5,A:30,g:0,p:0};

function thr(e){const P=Math.exp(lnP);const x=el2>=0?mixX:0,e2=E[el2>=0?el2:0];const mp=(e.mp*(1-x)+e2.mp*x)*(1+.01*Math.log(P));let bp=(e.bp*(1-x)+e2.bp*x)*(1+.1*Math.log(P));bp=Math.max(bp,mp*1.05);return{mp,bp,tp:Math.max(Math.max(bp*2.2,4000)/(1+E_*1.5),bp*1.1)}}

/* ---------- 3D ---------- */
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x070b14);sc.fog=new THREE.FogExp2(0x070b14,.015);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
sc.add(new THREE.HemisphereLight(0xbfd8ff,0x101830,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(5,10,7);sc.add(dl);
const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10,10,10)),new THREE.LineBasicMaterial({color:0x4fd1ff,transparent:true,opacity:.55}));sc.add(box);
const grid=new THREE.GridHelper(10,10,0x2a4a7a,0x16264a);grid.position.y=-5;sc.add(grid);

P[j]=L[j];P[j+1]=L[j+1];P[j+2]=L[j+2];H[j]=(Math.random()-.5)*8.6;H[j+1]=-4.4+Math.random()*4.9;H[j+2]=(Math.random()-.5)*8.6;SF[i]=.5+Math.random()}
const mat=new THREE.MeshStandardMaterial({roughness:.35,metalness:.25}),

inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);inst.frustumCulled=false;sc.add(inst);
for(let i=0;i<NP;i++)inst.setColorAt(i,new THREE.Color(1,1,1));
const tx=document.createElement('canvas');tx.width=tx.height=64;{const x=tx.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}

/* ---------- camera / touch orbit ---------- */
let th=.7,ph=1.2,rad=22;const ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
if(ptr.size==1){th-=(e.clientX-o[0])*.006;ph=Math.min(2.9,Math.max(.2,ph-(e.clientY-o[1])*.006))}
ptr.set(e.pointerId,[e.clientX,e.clientY]);
if(ptr.size==2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)rad=Math.min(45,Math.max(9,rad*pd/d));pd=d}});
cv.addEventListener('wheel',e=>{rad=Math.min(45,Math.max(9,rad*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
function resize(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;if(w<h&&rad<20)rad=26;
const wd=w>=900;cam.setViewOffset(w,h,wd?-180:0,wd?0:$('panel').offsetHeight*.5,w,h);cam.updateProjectionMatrix();drawGraph()}
addEventListener('resize',resize);

/* ---------- UI ---------- */
function setEl(z){if(pickMode){el2=z==el?-1:z;pickMode=0;$('tbl').hidden=true;applyMix();return}el=z;applyMix();
document.querySelectorAll('#g button').forEach(b=>b.classList.toggle('sel',+b.dataset.z==z));$('tbl').hidden=true}
const bases=Array(NP).fill(new THREE.Color(0x4fd1ff));
const g=$('g');for(let z=0;z<=118;z++){const b=document.createElement('button'),[r,c]=pos(z);b.dataset.z=z;b.innerHTML=(z?'<i>'+z+'</i>':'')+E[z].s;b.title=E[z].n;b.style.gridRow=r;b.style.gridColumn=c;b.style.background=E[z].c;b.onclick=()=>setEl(z);g.appendChild(b)}
$('bEl').onclick=()=>{pickMode=0;$('tbl').hidden=false};$('bX').onclick=()=>$('tbl').hidden=true;
$('bSh').onclick=()=>{for(let i=0;i<NP*3;i++)V[i]+=(Math.random()-.5)*12};

const sT=$('sT'),sP=$('sP');

sP.oninput=()=>{lnP=-4.6+11.5*sP.value/1000};sP.oninput();
const EX=[['❄️ تجميد',t=>t.mp*.6],['💧 صهر',t=>t.mp*1.12],['♨️ غليان',t=>t.bp*1.08],['⚡ بلازما',t=>t.tp*1.08],['🏠 25°C',()=>298]];
EX.forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{tgt=Math.min(50000,Math.max(1,f(thr(E[el]))))};$('ex').appendChild(b)});
const gr=$('gr'),gx=gr.getContext('2d');

gx.setLineDash([]);gx.globalAlpha=1;gx.lineWidth=2;for(let i=1;i<hist.length;i++){gx.strokeStyle=SC[hist[i].s];gx.beginPath();gx.moveTo((i-1)/240*w,Y(hist[i-1].T));gx.lineTo(i/240*w,Y(hist[i].T));gx.stroke()}}

/* ---------- extras: macro, atom, experiments ---------- */
const mac=new THREE.Group();sc.add(mac);
const sMat=new THREE.MeshStandardMaterial({metalness:.85,roughness:.28,transparent:true}),lMat=new THREE.MeshStandardMaterial({metalness:.1,roughness:.1,transparent:true}),

function applyMix(){const c1=new THREE.Color(E[el].c),c2=new THREE.Color(E[el2>=0?el2:0].c);for(let i=0;i<NP;i++)bases[i]=(el2>=0&&SF[i]-.5<mixX)?c2:c1;$('mn').textContent=el2>=0?E[el2].s:'—';document.querySelectorAll('#g button').forEach(b=>b.classList.toggle('sel',+b.dataset.z==el))}
const mk=(r,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.3}));m.position.set(x,y,z);return m};

const nuc=new THREE.Group(),n=Math.min(Zn*2,30);for(let i=0;i<n;i++)nuc.add(mk(.3,i%2?0xff4d4d:0xb0b8c8,(Math.random()-.5)*.9,(Math.random()-.5)*.9,(Math.random()-.5)*.9));atomG.add(nuc);

if(!z){[-1,1].forEach(s=>{const h=mk(.55,0xffffff,s*1.5,-1.1,0);atomG.add(h);hs.push(h)});nuc.scale.setScalar(2.2)}

function startExp(k){expM=k;expG.clear();tg=[];alive=[];killed=0;tgt=300;sE.value=0;sE.oninput();rad=13;th=.5;ph=1.3;
const add=(p,c)=>{const m=mk(.15,c,p.x,p.y,p.z);expG.add(m);tg.push(m);alive.push(1)};
if(k==1){tooth=new THREE.Group();const w=new THREE.MeshStandardMaterial({color:0xf5f2e8,roughness:.4}),cr=new THREE.Mesh(new THREE.SphereGeometry(2,24,16),w);cr.scale.set(1.2,1,1);tooth.add(cr);
